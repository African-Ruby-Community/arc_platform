    about:
      title: "About ARC - African Ruby Community"
      page_title: "About us"
      page_description: "ARC brings entrepreneurs, developers, Designers, open source contributors together"
      workshop_alt: "ARC Workshop"
      description_1: "African Ruby Community, ARC, is an organization that was started in 2010. The community currently has a reach of over 5,000 members spread across East Africa, made up of developers (engineers), entrepreneurs, designers, and freelancers. In terms of development and demonstrations, the community focuses on Ruby technologies and frameworks, which are all open source and widely used by startups to prototype and carry out proof of concept with a go-to-market strategy."
      description_2: "The community hosts weekly and monthly meetups in different cities in East Africa. The community brings you Ruby Conference every year with different themes to fill the gap that exists between school and industry and in return helps spur innovation and growth in contribution to the global economy."
      description_3: "ARC brings entrepreneurs, developers, designers, and open source contributors. Why? We believe in a holistic approach; through entrepreneurship, a \"solution approach,\" and open source, we can solve so many problems. This in return empowers everyone who attends with technology \"tools\" and entrepreneurship \"methodology\" to reach their fullest potential and inspire the rest of the world and their communities."
      journey_title: "Our Journey"
      founded: "Founded"
      founded_desc: "African Ruby Community established in Nairobi, Kenya"
      regional_growth: "Regional Growth"
      regional_desc: "Expanded chapters across Uganda, Tanzania, and Rwanda"
      first_conf: "First RubyConf Africa"
      first_conf_desc: "Hosted the continent's first dedicated Ruby conference"
      members_desc: "Community grew to over 5,000 members across East Africa"
      growing: "Growing Strong"
      growing_desc: "Continuing to build Africa's Ruby ecosystem"
      cta_title: "Ready to Join Us?"
      cta_desc: "Be part of Africa's most vibrant Ruby developer community."

  # Code of conduct translations
  code_of_conduct:
    page_title: "Code of Conduct"
    page_description: "Read the Code of Conduct for the African Ruby Community. We are committed to providing a safe, inclusive, and welcoming environment for all members."
    badge: "Community Standards"
    title: "Code of Conduct"
    hero_alt: "African Ruby Community members interacting"
    commitment_title: "Our Commitment"
    commitment_text: "The African Ruby Community is dedicated to providing a harassment-free and inclusive environment for everyone regardless of gender identity and expression, sexual orientation, disabilities, neurodiversity, physical appearance, body size, ethnicity, nationality, race, age, religion, or other protected category."

    expected_behavior_title: "Expected Behavior"
    be_excellent_title: "Be Excellent to Each Other"
    be_excellent_text: "We want our community to be an excellent experience for everyone regardless of background. Treat everyone with respect. Participate while acknowledging that everyone deserves to be here and each of us has the right to enjoy our experience without fear of harassment, discrimination, or condescension, whether blatant or via micro-aggressions."
    speak_up_title: "Speak Up If You See or Hear Something"
    speak_up_text: "Harassment is not tolerated, and you are empowered to politely engage when you or others are disrespected. The person making you feel uncomfortable may not be aware of what they are doing, and politely bringing their behavior to their attention is encouraged. If you are being harassed or feel uncomfortable, notice that someone else is being harassed, or have any other concerns, please contact a community organizer immediately."

    unacceptable_behavior_title: "Unacceptable Behavior"
    harassment_text: "Harassment is not tolerated and includes but is not limited to:"
    harassment_1: "Verbal or written language that reinforces social structures of domination"
    harassment_2: "Sexual imagery in public or shared community spaces"
    harassment_3: "Deliberate intimidation, stalking, following, or harassing photography/recording"
    harassment_4: "Sustained disruption of meetups, discussions, online forums, or community channels"
    harassment_5: "Publishing private communications or personal data without consent"
    harassment_6: "Inappropriate physical contact and unwelcome sexual attention"
    harassment_compliance: "Members asked to stop any harassing behavior are expected to comply immediately."

    scope_title: "Scope"
    scope_text_1: "This policy extends to all community spaces—both online and offline—including meetups, online forums, chat channels, code repositories, social gatherings, all members, partners, sponsors, and organizers."
    scope_text_2: "The African Ruby Community reserves the right to refuse admittance to, or remove any person from, any community-hosted space or event (including future events) at any time in its sole discretion."
    zero_tolerance: "Our zero-tolerance policy means that we will review every allegation of violation of our Community Guidelines and respond appropriately."

    partners_title: "Partners and Sponsors"
    partners_text: "Sponsors, partner organizations, and community vendors are also subject to this policy. In particular, partners should not use sexualized images, activities, or other material, or otherwise create a sexualized environment in community interactions."

    why_important_title: "Why This Policy is Important"
    why_important_text: "Creating an official policy aims to make it clear that harassment of anyone for any reason is not acceptable within our community. This policy defines clear expectations for behavior, provides reassurance, and encourages inclusive participation."

    license_title: "License and Attribution"
    license_text_1: "This policy is licensed under the"
    license_link_text: "Creative Commons Zero License"
    license_text_2: "Feel free to adopt and adapt this policy for your local Ruby community chapters."

    cta_title: "Have Questions or Need to Report an Incident?"
    cta_desc: "Reach out to our community organizers privately. All reports are kept strictly confidential."

