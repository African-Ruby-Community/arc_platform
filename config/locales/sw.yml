        previous_description: "Wafadhili wa jumuiya ya Ruby ya Kiafrika"
        become_sponsor: "Kuwa mfadhili"
    about:
      title: "Kuhusu ARC - Jumuiya ya Ruby ya Kiafrika"
      page_title: "Kuhusu sisi"
      page_description: "ARC inaunganisha wajasiriamali, wabunifu, wabunifu wa michoro, wachangiaji wa chanzo huria pamoja"
      workshop_alt: "Warsha ya ARC"
      description_1: "Jumuiya ya Ruby ya Kiafrika, ARC, ni shirika lililoanzishwa mwaka 2010. Jumuiya hii kwa sasa ina ufikio wa zaidi ya wanachama 5,000 waliotawanyika katika Afrika Mashariki, wakiwemo wabunifu (wahandisi), wajasiriamali, wabunifu wa michoro, na wafanyakazi huru. Katika maendeleo na maonyesho, jumuiya inazingatia teknolojia na mifumo ya Ruby, ambayo yote ni ya chanzo huria na inatumika sana na makampuni mapya kuunda miundo na kufanya uthibitisho wa dhana pamoja na mkakati wa kuingia sokoni."
      description_2: "Jumuiya inaandaa mikutano ya kila wiki na kila mwezi katika miji mbalimbali ya Afrika Mashariki. Jumuiya inakupatia Mkutano wa Ruby kila mwaka na mada mbalimbali ili kujaza pengo linalopo kati ya shule na tasnia na kwa kurudi inasaidia kuchochea uvumbuzi na ukuaji katika mchango wa uchumi wa kimataifa."
      description_3: "ARC inaunganisha wajasiriamali, wabunifu, wabunifu wa michoro, na wachangiaji wa chanzo huria. Kwa nini? Tunaamini katika mbinu ya jumla; kupitia ujasiriamali, \"mbinu ya suluhisho,\" na chanzo huria, tunaweza kutatua matatizo mengi. Hii kwa kurudi inawapa nguvu kila mtu anayehudhuria \"zana\" za kiteknolojia na \"mbinu\" za ujasiriamali ili kufikia uwezo wao kamili na kuhamasisha ulimwengu mzima na jamii zao."
      journey_title: "Safari Yetu"
      founded: "Ilivyoanzishwa"
      founded_desc: "Jamii ya Ruby Afrika iliasisiwa mjini Nairobi, Kenya"
      regional_growth: "Ukuaji wa Kanda"
      regional_desc: "Kupanuka kwa matawi nchini Uganda, Tanzania, na Rwanda"
      first_conf: "RubyConf Africa ya Kwanza"
      first_conf_desc: "Iliandaa mkutano mkuu wa kwanza wa Ruby barani Afrika"
      members_desc: "Jamii ilikua na kufikia zaidi ya wanachama 5,000 kote Afrika Mashariki"
      growing: "Kuendelea Kuwa Imara"
      growing_desc: "Kuendelea kujenga mfumo wa kijamii wa Ruby barani Afrika"
      cta_title: "Uko Tayari Kujiunga Nasi?"
      cta_desc: "Kua sehemu ya jamii iliyochangamka zaidi ya waendelezaji wa Ruby barani Afrika."

  # Code of conduct translations
  code_of_conduct:
    page_title: "Mwongozo wa Maadili"
    page_description: "Soma Mwongozo wa Maadili wa Jamii ya Ruby Afrika. Tumejitolea kutoa mazingira salama, jumuishi, na ya kukaribisha kwa wanachama wote."
    badge: "Viwango vya Jamii"
    title: "Mwongozo wa Maadili"
    hero_alt: "Wanachama wa Jamii ya Ruby Afrika wakitagusana"
    commitment_title: "Kujitolea Kwetu"
    commitment_text: "Jamii ya Ruby Afrika imejitolea kutoa mazingira yasiyo na unyanyasaji na jumuishi kwa kila mtu bila kujali utambulisho au kujieleza kijinsia, mtazamo wa kijinsia, ulemavu, tofauti za kineuro, muonekano wa kimwili, ukubwa wa mwili, kabila, utaifa, rangi, umri, dini, au kipengele kingine chochote kilicholindwa."

    expected_behavior_title: "Tabia Inayotarajiwa"
    be_excellent_title: "Waweni Wema Kila Mmoja kwa Mwenzake"
    be_excellent_text: "Tunataka jamii yetu iwe na uzoefu bora kwa kila mtu bila kujali asili yake. Mtendee kila mtu kwa heshima. Shiriki ukitambua kuwa kila mtu anastahili kuwa hapa na kila mmoja wetu ana haki ya kufurahia uzoefu wetu bila hofu ya unyanyasaji, ubaguzi, au dharau, iwe ya wazi au kwa njia ya udhalilishaji mdogo."
    speak_up_title: "Zungumza Ukiona au Ukisikia Kitu"
    speak_up_text: "Unyanyasaji hauvumiliwi, na una uwezo wa kujihusisha kwa adabu wakati wewe au wengine mnapovunjiwa heshima. Mtu anayekufanya uhisi vibaya huenda asijue anachofanya, na inashauriwa kumfahamisha kwa adabu kuhusu tabia yake. Kama unafanyiwa unyanyasaji au unahisi vibaya, ukigundua kuwa mtu mwingine ananyanyaswa, au una wasiwasi mwingine wowote, tafadhali wasiliana na mwandaaji wa jamii mara moja."

    unacceptable_behavior_title: "Tabia Isiyokubalika"
    harassment_text: "Unyanyasaji hauvumiliwi na unajumuisha lakini hauishii kwa:"
    harassment_1: "Lugha ya maneno au ya maandishi inayosisitiza mfumo wa utawala wa kijamii"
    harassment_2: "Picha au maudhui ya kingono katika maeneo ya umma au ya pamoja ya jamii"
    harassment_3: "Kutisha kimakusudi, kumfuatilia mtu, au kupiga picha/kurekodi kwa nia ya kunyanyasa"
    harassment_4: "Usumbufu unaoendelea wa mikutano, majadiliano, jukwaa la mtandaoni, au njia za mawasiliano za jamii"
    harassment_5: "Kuchapisha mawasiliano ya kibinafsi au taarifa za siri bila idhini"
    harassment_6: "Mawasiliano yasiyofaa ya kimwili na umakini wa kingono usiotakiwa"
    harassment_compliance: "Wanachama wanaoombwa kuacha tabia yoyote ya unyanyasaji wanatakiwa kutii mara moja."

    scope_title: "Wigo wa Mwongozo"
    scope_text_1: "Sera hii inahusu maeneo yote ya jamii—mtandaoni na nje ya mtandao—pamoja na mikutano, majukwaa ya mtandaoni, njia za mazungumzo, hifadhi za kodi, mikusanyiko ya kijamii, wanachama wote, washirika, wadhamini, na waandaaji."
    scope_text_2: "Jamii ya Ruby Afrika inahifadhi haki ya kumkatalia mtu kuingia, au kumwondoa mtu yeyote kutoka kwa eneo au tukio lolote linaloandaliwa na jamii (pamoja na matukio ya baadaye) wakati wowote kwa hiari yake."
    zero_tolerance: "Sera yetu ya kutovumilia kabisa inamaanisha kuwa tutakagua kila madai ya ukiukaji wa Miongozo ya Jamii yetu na kujibu kwa njia inayofaa."

    partners_title: "Washirika na Wadhamini"
    partners_text: "Wadhamini, mashirika washirika, na wauzaji wa jamii pia wako chini ya sera hii. Hasa, washirika hawapaswi kutumia picha za kingono, shughuli, au vifaa vingine, au kuunda mazingira ya kingono katika mwingiliano wa jamii."

    why_important_title: "Kwa Nini Sera Hii ni Muhimu"
    why_important_text: "Kuunda sera rasmi kunalenga kuweka wazi kuwa unyanyasaji wa mtu yeyote kwa sababu yoyote haukubaliki ndani ya jamii yetu. Sera hii inafafanua matarajio ya wazi ya tabia, inatoa hakikisho, na inahimiza ushiriki jumuishi."

    license_title: "Leseni na Uteuzi"
    license_text_1: "Sera hii imepewa leseni chini ya"
    license_link_text: "Leseni ya Creative Commons Zero"
    license_text_2: "Jisikie huru kuchukua na kubadilisha sera hii kwa matawi yako ya kijamii ya Ruby ya eneo husika."

    cta_title: "Je, Unamaswali au Unahitaji Kuripoti Tukio?"
    cta_desc: "Wasiliana na waandaaji wetu wa jamii kwa faragha. Taarifa zote zinahifadhiwa kwa siri kubwa."
