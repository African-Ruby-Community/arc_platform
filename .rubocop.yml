plugins:
  - rubocop-performance
  - rubocop-rails

AllCops:
  UseCache: false
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4
  Exclude:
    - bin/**/*
    - config/**/*
    - db/migrate/*
    - db/schema.rb
    - node_modules/**/*
    - public/**/*
    - tmp/**/*
    - vendor/**/*

Style/Documentation:
  Enabled: false

# Disable OpenStruct warnings for tests
Style/OpenStructUse:
  Exclude:
    - 'test/**/*'

# Allow longer lines in seed files and tests
Layout/LineLength:
  Max: 160
  Exclude:
    - 'db/seeds.rb'
    - 'test/**/*'

# Relax metrics for test files
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Metrics/MethodLength:
  Max: 15
  Exclude:
    - 'test/**/*'
    - 'db/seeds.rb'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'db/seeds.rb'

Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

# Allow variable numbers in tests
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Allow empty test files
Lint/EmptyFile:
  Exclude:
    - 'test/**/*'

# Disable duplicate branch warnings
Lint/DuplicateBranch:
  Enabled: false

# Move locale texts to locale files
Rails/I18nLocaleTexts:
  Enabled: false

Rails/LexicallyScopedActionFilter:
  Exclude:
    - 'app/controllers/users/sessions_controller.rb'
    - 'app/controllers/users/registrations_controller.rb'

